<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Boy Vogel</title>
<style>
  :root { --bg1:#2b1f4a; --bg2:#0f0b1f; --text:#f4e9ff; --accent:#ff9ec7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2)); color:var(--text);
         font-family: system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; overflow-x:hidden; }
  h1 { font-size:clamp(20px,5vw,32px); margin:0 0 8px; letter-spacing:.5px; }
  #stage { width:min(520px,100%); cursor:pointer; }
  svg { width:100%; height:auto; display:block; }
  #sub { min-height:2.4em; font-size:clamp(18px,4.5vw,26px); font-style:italic; color:var(--accent); text-align:center; transition:opacity .4s; }
  button { margin-top:10px; background:var(--accent); color:#2b1f4a; border:0; border-radius:999px; padding:12px 26px; font-size:18px; font-weight:700; cursor:pointer; }
  button:active { transform:scale(.96); }

  #bird { transform-origin: 260px 520px; animation: sway 4.5s ease-in-out infinite; }
  @keyframes sway { 0%,100%{ transform:rotate(-2.5deg);} 50%{ transform:rotate(2.5deg);} }
  .lid { transform-box: fill-box; transform-origin: top; animation: blink 5s infinite; }
  @keyframes blink { 0%,86%,100%{ transform:scaleY(1);} 90%,94%{ transform:scaleY(1.9);} }
  .z { font: bold 28px system-ui; fill:#cfc2ff; opacity:0; animation: zz 3.6s linear infinite; }
  .z:nth-of-type(2){ animation-delay:1.2s; font-size:22px; }
  .z:nth-of-type(3){ animation-delay:2.4s; font-size:34px; }
  @keyframes zz { 0%{ opacity:0; transform:translate(0,0);} 20%{opacity:.9;} 100%{ opacity:0; transform:translate(40px,-90px);} }
  .heart { fill:#ff6fa8; opacity:0; }
  .wiggle { transform-box: fill-box; transform-origin: 50% 0; animation: toes 1.6s ease-in-out infinite; }
  .wiggle:nth-child(2){animation-delay:.15s} .wiggle:nth-child(3){animation-delay:.3s} .wiggle:nth-child(4){animation-delay:.45s} .wiggle:nth-child(5){animation-delay:.6s}
  @keyframes toes { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
</style>
</head>
<body>
<h1>🐦 Der Good-Boy-Vogel</h1>
<div id="stage" title="Klick mich">
<svg viewBox="0 0 520 640" aria-label="Verschlafener Vogel mit Menschenfüßen">
  <!-- Boden -->
  <ellipse cx="260" cy="610" rx="170" ry="16" fill="#000" opacity=".35"/>

  <!-- Beine mit Menschenfüßen -->
  <g id="legs">
    <path d="M215 430 C205 480 212 530 205 585" stroke="#e9b48f" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M305 430 C315 480 308 530 315 585" stroke="#e9b48f" stroke-width="30" stroke-linecap="round" fill="none"/>
    <!-- Knie -->
    <ellipse cx="210" cy="505" rx="13" ry="9" fill="#dca07c"/>
    <ellipse cx="311" cy="505" rx="13" ry="9" fill="#dca07c"/>
    <!-- Haare an den Beinen -->
    <g stroke="#8a5a3c" stroke-width="1.5" stroke-linecap="round">
      <path d="M200 545 l-6 -5 M205 560 l-6 -4 M198 530 l-5 -5"/>
      <path d="M322 545 l6 -5 M318 560 l6 -4 M324 530 l5 -5"/>
    </g>
    <!-- linker Fuß -->
    <g>
      <path d="M220 575 C200 572 150 580 140 598 C135 610 150 614 175 612 L220 612 C232 612 234 590 220 575Z" fill="#f0bf9b" stroke="#c98d68" stroke-width="2"/>
      <g fill="#f0bf9b" stroke="#c98d68" stroke-width="2">
        <ellipse class="wiggle" cx="140" cy="603" rx="11" ry="9"/>
        <ellipse class="wiggle" cx="156" cy="597" rx="8" ry="7"/>
        <ellipse class="wiggle" cx="168" cy="594" rx="7" ry="6.5"/>
        <ellipse class="wiggle" cx="179" cy="592" rx="6" ry="6"/>
        <ellipse class="wiggle" cx="189" cy="591" rx="5" ry="5.5"/>
      </g>
      <ellipse cx="136" cy="600" rx="5" ry="4" fill="#fde3e8" opacity=".9"/>
    </g>
    <!-- rechter Fuß -->
    <g>
      <path d="M300 575 C320 572 370 580 380 598 C385 610 370 614 345 612 L300 612 C288 612 286 590 300 575Z" fill="#f0bf9b" stroke="#c98d68" stroke-width="2"/>
      <g fill="#f0bf9b" stroke="#c98d68" stroke-width="2">
        <ellipse class="wiggle" cx="380" cy="603" rx="11" ry="9"/>
        <ellipse class="wiggle" cx="364" cy="597" rx="8" ry="7"/>
        <ellipse class="wiggle" cx="352" cy="594" rx="7" ry="6.5"/>
        <ellipse class="wiggle" cx="341" cy="592" rx="6" ry="6"/>
        <ellipse class="wiggle" cx="331" cy="591" rx="5" ry="5.5"/>
      </g>
      <ellipse cx="384" cy="600" rx="5" ry="4" fill="#fde3e8" opacity=".9"/>
    </g>
  </g>

  <g id="bird">
    <!-- Schwanz -->
    <path d="M120 360 L50 330 L70 370 L40 395 L125 395Z" fill="#5a8fd6"/>
    <!-- Körper -->
    <ellipse cx="260" cy="340" rx="150" ry="125" fill="#7fb3f5"/>
    <ellipse cx="270" cy="370" rx="95" ry="85" fill="#fff3d6"/>
    <!-- Flügel -->
    <path d="M140 320 C110 380 150 430 210 415 C190 380 180 350 140 320Z" fill="#5a8fd6"/>
    <path id="wingR" d="M380 320 C410 380 370 430 310 415 C330 380 340 350 380 320Z" fill="#5a8fd6"/>
    <!-- Kopf -->
    <circle cx="260" cy="190" r="105" fill="#7fb3f5"/>
    <!-- Federschopf (verwuschelt) -->
    <path d="M240 92 C230 50 255 40 258 85 C262 35 290 45 275 92Z" fill="#5a8fd6"/>
    <!-- Schlafmütze -->
    <path d="M175 120 C200 50 300 40 345 115 C320 100 210 100 175 120Z" fill="#b36bd9"/>
    <path d="M330 95 C370 80 400 110 405 150" stroke="#b36bd9" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="408" cy="160" r="16" fill="#fff"/>
    <!-- Augen (halb zu, verschlafen) -->
    <g>
      <ellipse cx="220" cy="185" rx="30" ry="26" fill="#fff"/>
      <ellipse cx="300" cy="185" rx="30" ry="26" fill="#fff"/>
      <circle id="pupL" cx="224" cy="194" r="11" fill="#2a1b3d"/>
      <circle id="pupR" cx="296" cy="194" r="11" fill="#2a1b3d"/>
      <circle cx="228" cy="190" r="3" fill="#fff"/>
      <circle cx="300" cy="190" r="3" fill="#fff"/>
      <path class="lid" d="M188 186 A32 30 0 0 1 252 186 Z" fill="#6aa0e6"/>
      <path class="lid" d="M268 186 A32 30 0 0 1 332 186 Z" fill="#6aa0e6"/>
      <path d="M190 186 Q220 196 250 186" stroke="#2a1b3d" stroke-width="3" fill="none"/>
      <path d="M270 186 Q300 196 330 186" stroke="#2a1b3d" stroke-width="3" fill="none"/>
      <!-- Augenringe -->
      <path d="M198 213 Q220 222 242 213" stroke="#5a6fb0" stroke-width="3" fill="none" opacity=".7"/>
      <path d="M278 213 Q300 222 322 213" stroke="#5a6fb0" stroke-width="3" fill="none" opacity=".7"/>
    </g>
    <!-- Wangen -->
    <ellipse id="blushL" cx="185" cy="232" rx="20" ry="11" fill="#ff7fb0" opacity=".55"/>
    <ellipse id="blushR" cx="335" cy="232" rx="20" ry="11" fill="#ff7fb0" opacity=".55"/>
    <!-- Schnabel -->
    <g id="beak">
      <path id="beakLow" d="M232 238 L288 238 L260 262Z" fill="#e8892e"/>
      <path d="M228 222 Q260 205 292 222 L260 246Z" fill="#ffae42"/>
    </g>
    <!-- Herzchen -->
    <path class="heart" id="h1" d="M0 6 C0 -2 10 -2 10 4 C10 -2 20 -2 20 6 C20 13 10 18 10 22 C10 18 0 13 0 6Z" transform="translate(360 220)"/>
    <path class="heart" id="h2" d="M0 6 C0 -2 10 -2 10 4 C10 -2 20 -2 20 6 C20 13 10 18 10 22 C10 18 0 13 0 6Z" transform="translate(140 210)"/>
  </g>
  <!-- Zzz -->
  <text class="z" x="370" y="110">z</text>
  <text class="z" x="385" y="95">z</text>
  <text class="z" x="360" y="90">Z</text>
</svg>
</div>
<div id="sub"></div>
<button id="play">▶ Abspielen</button>
<audio id="voice" src="audio/good-boy.mp3" preload="auto"></audio>

<script>
  const audio = document.getElementById('voice');
  const beakLow = document.getElementById('beakLow');
  const sub = document.getElementById('sub');
  const btn = document.getElementById('play');
  const hearts = [document.getElementById('h1'), document.getElementById('h2')];
  const blush = [document.getElementById('blushL'), document.getElementById('blushR')];
  const lines = [
    [0.4, 'Heeey… 🥱'],
    [2.5, 'mmmh…'],
    [4.9, 'mein kleiner…'],
    [7.8, 'Good Boy… 😏'],
    [10.9, 'mmmmh… 💕']
  ];
  let ctx, analyser, data;

  function setupAudio() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      data = new Uint8Array(analyser.fftSize);
      src.connect(analyser); analyser.connect(ctx.destination);
    } catch (e) { analyser = null; }
  }

  function level() {
    if (!analyser) return audio.paused ? 0 : 0.5 + 0.5 * Math.sin(performance.now() / 90);
    analyser.getByteTimeDomainData(data);
    let s = 0; for (const v of data) { const d = (v - 128) / 128; s += d * d; }
    return Math.min(1, Math.sqrt(s / data.length) * 6);
  }

  let smooth = 0;
  function frame(t) {
    smooth += (level() - smooth) * 0.35;
    const open = smooth * 22;
    beakLow.setAttribute('d', `M232 238 L288 238 L260 ${262 + open}Z`);
    const playing = !audio.paused;
    const pulse = playing ? 0.55 + 0.35 * Math.abs(Math.sin(t / 400)) : 0.55;
    blush.forEach(b => b.setAttribute('opacity', pulse.toFixed(2)));
    hearts.forEach((h, i) => {
      const p = ((t / 2200) + i * 0.5) % 1;
      h.style.opacity = playing ? (1 - p).toFixed(2) : 0;
      h.style.transform = `translateY(${-p * 60}px)`;
    });
    if (playing) {
      let txt = '';
      for (const [time, l] of lines) if (audio.currentTime >= time) txt = l;
      sub.textContent = txt;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function play() {
    setupAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    audio.currentTime = 0;
    audio.play();
    btn.textContent = '↻ Nochmal';
  }
  btn.addEventListener('click', play);
  document.getElementById('stage').addEventListener('click', play);
  audio.addEventListener('ended', () => { setTimeout(() => sub.textContent = 'z z z …', 400); });
</script>
</body>
</html>
