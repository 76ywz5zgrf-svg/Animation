<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omas Good-Boy-Vogel</title>
<style>
  :root { --bg:#1c1b24; --text:#f1eef8; --accent:#ff9ec7; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px 16px 20px; overflow-x:hidden; }
  h1 { font-size:clamp(20px,5vw,30px); margin:4px 0 8px; }
  #stage { position:relative; width:min(640px,100%); aspect-ratio: 4 / 5; border-radius:16px; overflow:hidden; background:#24232e; touch-action:none; }
  #stage canvas { display:block; width:100%; height:100%; }
  #sub { position:absolute; left:50%; transform:translateX(-50%); width:max-content; max-width:92%; bottom:14px; background:rgba(20,18,30,.72);
         padding:6px 16px; border-radius:999px; text-align:center; font-size:clamp(18px,4.5vw,26px); font-style:italic; color:var(--accent); pointer-events:none; }
  #sub:empty { display:none; }
  #hint { position:absolute; top:10px; left:0; right:0; text-align:center; font-size:13px; opacity:.6; pointer-events:none; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  button { margin-top:12px; background:var(--accent); color:#2b1f4a; border:0; border-radius:999px; padding:12px 26px; font-size:18px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>🐦 Omas Good-Boy-Vogel</h1>
<div id="stage">
  <div id="hint">Ziehen = drehen · Scrollen/Pinch = zoomen</div>
  <div id="sub"></div>
  <div id="msg">Lade Vogel …</div>
</div>
<button id="play">▶ Abspielen</button>
<audio id="voice" src="audio/good-boy-20s.mp3" preload="auto"></audio>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<!-- 3D-Scan als eingebettete Datei, damit die Seite auch per Doppelklick (file://) funktioniert -->
<script src="models/omas-vogel.glb.js"></script>
<script>
(() => {
const stage = document.getElementById('stage'), msg = document.getElementById('msg');
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.getElementById('hint').style.display = 'none';
window.__t = 0; window.__lvl = 0;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
catch (e) { msg.textContent = 'WebGL wird von diesem Browser nicht unterstützt.'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.localClippingEnabled = true;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x24232e);
scene.fog = new THREE.Fog(0x24232e, 10, 22);
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture; }

const camera = new THREE.PerspectiveCamera(34, 4 / 5, 0.1, 100);
camera.position.set(5.2, 3.0, 7.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 1.85, 0);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2.5; controls.maxDistance = 12; controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xe8ecff, 0x4a3f36, 0.35));
const key = new THREE.DirectionalLight(0xfff1e0, 1.5);
key.position.set(4, 7, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 5, bottom: -1, near: 1, far: 20 });
key.shadow.bias = -0.0005; key.shadow.radius = 4; scene.add(key);
const rim = new THREE.DirectionalLight(0xa9c4ff, 0.7); rim.position.set(-4, 4, -5); scene.add(rim);

// ---------- Texturen ----------
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvasTex(w, h, draw, rep = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.anisotropy = 8; return t;
}
const skinTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e4a586'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) { g.globalAlpha = .13 * rnd(); g.fillStyle = rnd() > .5 ? '#c27a5b' : '#f6c9ae';
    g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * 1.6, 0, 7); g.fill(); }
}, [3, 3]);
const stoneTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8f8e89'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.globalAlpha = .3 * rnd(); g.fillStyle = rnd() > .5 ? '#b2b1ab' : '#5e5d59'; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
}, [2, 2]);
const groundTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#5a5a63'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40000; i++) { g.globalAlpha = .25 * rnd(); g.fillStyle = rnd() > .5 ? '#7a7a84' : '#3b3b42'; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  g.globalAlpha = 1; g.strokeStyle = '#2f2f36'; g.lineWidth = 6;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
    g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
}, [4, 4]);

const M = {
  skin: new THREE.MeshPhysicalMaterial({ map: skinTex, roughness: .55, sheen: .4, sheenColor: new THREE.Color(0xffb59a), clearcoat: .1, clearcoatRoughness: .5 }),
  nail: new THREE.MeshPhysicalMaterial({ color: 0xcf8a80, roughness: .35, clearcoat: .35, envMapIntensity: .3, clearcoatRoughness: .2 }),
  nailTip: new THREE.MeshPhysicalMaterial({ color: 0xf6e6dc, roughness: .4, clearcoat: .5 }),
  crease: new THREE.MeshStandardMaterial({ color: 0xa8664c, roughness: .8 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x3e2a1e, roughness: .8 }),
  stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 1 }),
  ground: new THREE.MeshStandardMaterial({ map: groundTex, roughness: .95 }),
};
function mesh(geo, mat, parent, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot); m.scale.set(...scl);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function deform(geo, fn) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); fn(v); p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); return geo;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), M.ground);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
for (let i = 0; i < 9; i++) {
  const g = deform(new THREE.IcosahedronGeometry(.03 + rnd() * .03, 1), v => v.multiplyScalar(.8 + rnd() * .4));
  mesh(g, new THREE.MeshStandardMaterial({ color: 0xc89a5c, roughness: 1 }), scene, [1.4 + rnd() * 1.5, .03, -1 + rnd() * 2.4]);
}

// ---------- Figur: ein Bein, ein Riesenzeh ----------
const rig = new THREE.Group(); scene.add(rig);          // alles, was schaukelt
const BIRD_BASE = 1.85;                                 // Höhe, auf der der Vogel sitzt

// Riesenzeh als Fuß (zeigt nach +x, wie der Vogel)
const toe = new THREE.Group(); rig.add(toe);
const TOE_C = [.25, .27, 0];
const toeGeo = deform(new THREE.SphereGeometry(1, 128, 64), v => {
  const x = v.x;
  // Kapsel-artig: Seiten fast gerade, Enden rund
  const r = Math.sqrt(Math.max(0, 1 - x * x)), straight = Math.pow(r, .45);
  let y = v.y / (r || 1) * straight, z = v.z / (r || 1) * straight;
  if (y < 0) y *= .8;                                  // Zehenballen unten flacher
  const taper = 1 - .12 * Math.max(0, x) + .06 * Math.max(0, -x);
  v.set(x * .82, y * .27 * taper, z * .3 * taper);
  v.y += .06 * Math.pow(Math.max(0, x), 3);            // Spitze leicht nach oben
});
const toeMesh = mesh(toeGeo, M.skin, toe, TOE_C);
// Nagel: per Raycast genau auf die Hautoberfläche gesetzt
toe.updateMatrixWorld(true);
function surfaceAt(x, z) {
  const rc = new THREE.Raycaster(new THREE.Vector3(x, 3, z), new THREE.Vector3(0, -1, 0));
  const hit = rc.intersectObject(toeMesh)[0];
  return hit ? { p: hit.point, n: hit.face.normal.clone().transformDirection(toeMesh.matrixWorld) } : null;
}
{
  const nailGeo = deform(new THREE.SphereGeometry(1, 48, 24), v => { if (v.y < 0) v.y *= .15; v.set(v.x * .27, v.y * .03, v.z * .22); });
  const s = surfaceAt(.72, 0);
  if (s) {
    const nail = mesh(nailGeo, M.nail, toe, [s.p.x, s.p.y + .004, s.p.z]);
    nail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), s.n);
    const tip = mesh(deform(new THREE.SphereGeometry(1, 32, 12), v => { if (v.y < 0) v.y *= .15; v.set(v.x * .06, v.y * .032, v.z * .2); }),
      M.nailTip, toe, [s.p.x + .24, s.p.y - .06, s.p.z]);
    tip.quaternion.copy(nail.quaternion);
  }
}
// Falten am Gelenk (oben über den Zeh gelegt)
for (const [x, w] of [[-.08, 1], [-.02, .95], [.04, .9]]) {
  const s = surfaceAt(x, 0); if (!s) continue;
  mesh(new THREE.TorusGeometry(1, .01, 6, 48, Math.PI), M.crease, toe, [x, TOE_C[1], 0], [0, Math.PI / 2, 0], [.3 * w, s.p.y - TOE_C[1] + .003, 1]);
}
// Härchen auf dem Zeh
{
  const hairs = new THREE.InstancedMesh(new THREE.CylinderGeometry(.004, .002, .05, 4), M.hair, 50), d = new THREE.Object3D();
  let n = 0;
  for (let i = 0; i < 50; i++) {
    const s = surfaceAt(-.25 + rnd() * .55, (rnd() - .5) * .2); if (!s) continue;
    d.position.copy(s.p); d.rotation.set((rnd() - .5) * .8, 0, -1 + rnd() * .4); d.updateMatrix(); hairs.setMatrixAt(n++, d.matrix);
  }
  hairs.count = n; toe.add(hairs);
}

// Bein (Schienbein + Knie + Wade + Knöchel), sitzt hinten auf dem Zeh
const leg = new THREE.Group(); rig.add(leg);
const LX = -.3;
mesh(new THREE.SphereGeometry(.2, 48, 32), M.skin, leg, [LX, .5, 0], [0, 0, 0], [1.1, 1, 1.15]);              // Knöchel
mesh(new THREE.SphereGeometry(.06, 16, 12), M.skin, leg, [LX, .55, .2]);
mesh(new THREE.SphereGeometry(.06, 16, 12), M.skin, leg, [LX, .57, -.2]);
mesh(new THREE.CapsuleGeometry(.155, 1.15, 8, 32), M.skin, leg, [LX, 1.15, 0]);                                    // Schienbein
mesh(new THREE.SphereGeometry(.17, 32, 24), M.skin, leg, [LX - .09, 1.3, 0], [0, 0, -.08], [1, 2.0, 1]);          // Wade
mesh(new THREE.SphereGeometry(.15, 32, 24), M.skin, leg, [LX + .04, 1.78, 0], [0, 0, 0], [1.05, .9, 1.1]);          // Knie
{
  const hairs = new THREE.InstancedMesh(new THREE.CylinderGeometry(.004, .002, .07, 4), M.hair, 200), d = new THREE.Object3D();
  for (let i = 0; i < 200; i++) {
    const a = rnd() * Math.PI * 2, y = .65 + rnd() * 1.05;
    d.position.set(LX + Math.cos(a) * .158, y, Math.sin(a) * .158);
    d.rotation.set(Math.sin(a) * .9, 0, -Math.cos(a) * .9 - .4); d.updateMatrix(); hairs.setMatrixAt(i, d.matrix);
  }
  leg.add(hairs);
}
// Steinplatte unter dem Vogel, wo das Bein herauskommt
const cap = mesh(new THREE.SphereGeometry(1, 64, 32), M.stone, rig, [-.2, BIRD_BASE + .02, 0], [0, 0, 0], [.5, .08, .42]);

// ---------- Vogel (3D-Scan) ----------
const birdHolder = new THREE.Group(); rig.add(birdHolder);
let bird = null, headPos = new THREE.Vector3(.6, 3.2, 0);
const clip = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
try {
  const raw = atob(window.OMAS_VOGEL_GLB), bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  new THREE.GLTFLoader().parse(bin.buffer, '', gltf => {
    bird = gltf.scene;
    const box = new THREE.Box3().setFromObject(bird), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const s = 2.7 / size.x;                                   // Vogel ca. 2,7 Einheiten lang
    bird.scale.setScalar(s);
    bird.position.set(-c.x * s, -box.min.y * s, -c.z * s);   // unten mittig auf 0
    birdHolder.add(bird);
    const H = size.y * s;
    birdHolder.position.y = BIRD_BASE - H * .14;              // Steinfüße liegen unter der Schnittebene
    clip.constant = -(BIRD_BASE + .02);                       // alles unter der Platte wegschneiden
    bird.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true;
      o.material.clippingPlanes = [clip]; o.material.side = THREE.DoubleSide; o.material.envMapIntensity = .5; } });
    headPos.set(size.x * s * .28, BIRD_BASE + H * .86, 0);
    msg.style.display = 'none';
  }, e => { msg.textContent = 'Vogel konnte nicht geladen werden.'; console.error(e); });
} catch (e) { msg.textContent = 'Vogel konnte nicht geladen werden.'; console.error(e); }

// Zzz
const zTex = canvasTex(128, 128, g => { g.fillStyle = '#d8ccff'; g.font = 'bold 96px Georgia'; g.textAlign = 'center'; g.fillText('z', 64, 96); });
const zs = [0, 1, 2].map(() => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: zTex, transparent: true, depthWrite: false })); scene.add(sp); return sp; });

// ---------- Audio ----------
const audio = document.getElementById('voice');
const sub = document.getElementById('sub'), btn = document.getElementById('play');
const lines = [[0.32,'Heeey… 🥱'],[1.45,'mmmh…'],[3.19,'Good Boy… 😏'],[4.96,'mein kleiner…'],[6.64,'guter Junge… 🥺'],[8.69,'ja… du bist mein Good Boy 💕'],[12.44,'mmmh…'],[14.31,'komm her… 🥱'],[15.5,'mein kleiner guter Junge… 😏'],[18.06,'Good Boy… 💕'],[19.78,'mmmmh… z z z']];
let actx, analyser, data;
function setupAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser(); analyser.fftSize = 512; data = new Uint8Array(512);
    src.connect(analyser); analyser.connect(actx.destination);
  } catch (e) { analyser = null; }
}
function level() {
  if (!analyser) return audio.paused ? 0 : 0.5 + 0.5 * Math.sin(performance.now() / 90);
  analyser.getByteTimeDomainData(data);
  let s = 0; for (const v of data) { const d = (v - 128) / 128; s += d * d; }
  return Math.min(1, Math.sqrt(s / data.length) * 6);
}
btn.addEventListener('click', () => {
  setupAudio(); if (actx && actx.state === 'suspended') actx.resume();
  audio.currentTime = 0; audio.play(); btn.textContent = '↻ Nochmal';
});
audio.addEventListener('ended', () => setTimeout(() => sub.textContent = 'z z z …', 400));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

// ---------- Animation ----------
let smooth = 0; const clock = new THREE.Clock();
function tick() {
  const t = RENDER ? window.__t : clock.getElapsedTime();
  smooth += ((RENDER ? window.__lvl : level()) - smooth) * 0.35;
  const talking = RENDER ? (t > 0.2 && t < 22.4) : !audio.paused;

  // verschlafenes Schaukeln auf dem einen Bein
  rig.rotation.z = Math.sin(t * 1.1) * .035;
  rig.rotation.x = Math.sin(t * .8) * .03;
  // beim Sprechen nickt und "pumpt" der Vogel mit der Stimme
  birdHolder.rotation.z = -smooth * .09 + Math.sin(t * .7) * .03;
  birdHolder.rotation.y = Math.sin(t * .45) * .12;
  birdHolder.scale.set(1 - smooth * .015, 1 + smooth * .035, 1 - smooth * .015);
  // Riesenzeh wackelt
  toe.rotation.z = Math.max(0, Math.sin(t * 2.4)) * .1;

  zs.forEach((z, i) => {
    const p = ((t / 3.5) + i / 3) % 1;
    z.position.set(headPos.x + .1 + p * .4, headPos.y + .3 + p * 1.0, headPos.z + p * .25);
    z.scale.setScalar(.18 + p * .22 + i * .03); z.material.opacity = talking ? 0 : Math.sin(p * Math.PI) * .85;
  });

  const now = RENDER ? t : audio.currentTime;
  if (talking || RENDER) { let txt = ''; for (const [tm, l] of lines) if (now >= tm) txt = l; sub.textContent = txt; }
  if (RENDER) {   // langsame Kamerafahrt fürs Video
    const a = .62 + Math.sin(t * .18) * .55, dist = 9.6 - t * .05;
    camera.position.set(.1 + Math.sin(a) * dist, 3.0 + Math.sin(t * .25) * .35, Math.cos(a) * dist);
    camera.lookAt(.1, 1.8, 0);
  } else controls.update();
  renderer.render(scene, camera);
  if (!RENDER) requestAnimationFrame(tick);
}
window.__frame = (time, lvl) => { window.__t = time; window.__lvl = lvl; tick(); };
window.__ready = () => !!bird;
tick();
})();
</script>
</body>
</html>
